name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a manual "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # v4 no longer requests Google's removed legacy `tools` package.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Unit tests (core)
        run: ./gradlew :core:test -PskipApp=true --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            android/core/build/reports/tests/test/
            android/core/build/test-results/test/

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-mover-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
